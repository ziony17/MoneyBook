<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PC 대시보드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#16171A;text-decoration:none}a:hover{color:#000}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 900px; background: #F5F6F8; color: #16171A; font-family: 'IBM Plex Sans KR', sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; align-items: stretch">

<aside style="flex: 1 1 220px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E6E8EC; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div style="width: 32px; height: 32px; border-radius: 10px; background: #16171A; display: flex; align-items: center; justify-content: center">
<div style="width: 12px; height: 12px; border-radius: 4px; background: #F25A40"></div>
</div>
<span style="font-size: 17px; font-weight: 700">가계부</span>
</div>
<nav aria-label="메뉴" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="7">
<button type="button" style="height: 42px; padding: 0 12px; border: 0; border-radius: 10px; text-align: left; font-size: 14px; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.weight}}">{{m.label}}</button>
</sc-for>
</nav>
<div style="flex: 1"></div>
<div style="padding: 12px; border-radius: 12px; background: #F5F6F8; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #3A3C42">
<span style="width: 8px; height: 8px; border-radius: 99px; background: #21806F; flex: none"></span>
<span>모바일과 동기화됨 · 방금 전</span>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" aria-label="이전 달" style="width: 36px; height: 36px; border: 1px solid #E6E8EC; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
</button>
<h1 style="margin: 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">2026년 10월</h1>
<button type="button" aria-label="다음 달" style="width: 36px; height: 36px; border: 1px solid #E6E8EC; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #E6E8EC; border-radius: 10px; background: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"></rect><path d="M9 3h6v3H9z"></path></svg>문자 붙여넣기</button>
<button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #DD4428; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>내역 추가</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="background: #16171A; color: #FFFFFF; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #C9CACD">남은 예산</span>
<span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">412,300원</span>
<div style="height: 6px; border-radius: 99px; background: #FFFFFF2E; overflow: hidden"><div style="width: 72.5%; height: 100%; background: #F25A40; border-radius: 99px"></div></div>
<span style="font-size: 12px; color: #D7D8DB">예산 1,500,000원 중 72% 사용</span>
</div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #5F6168">수입</span>
<span style="font-size: 24px; font-weight: 700; color: #2457C5">+3,200,000</span>
<span style="font-size: 12px; color: #5F6168">1건</span>
</div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #5F6168">지출</span>
<span style="font-size: 24px; font-weight: 700; color: #D63B26">-1,087,700</span>
<span style="font-size: 12px; color: #5F6168">지난달 이맘때보다 64,200원 적음</span>
</div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #5F6168">합계</span>
<span style="font-size: 24px; font-weight: 700">+2,112,300</span>
<span style="font-size: 12px; color: #5F6168">10월 1일 – 11일</span>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 18px 8px 8px 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 12px 10px 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">최근 내역</h2>
<span style="font-size: 12px; color: #5F6168">입력 줄에서 Enter로 바로 추가</span>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14px">
<thead>
<tr style="color: #5F6168; font-size: 12px; text-align: left">
<th style="padding: 8px 12px; font-weight: 500">날짜</th>
<th style="padding: 8px 12px; font-weight: 500">분류</th>
<th style="padding: 8px 12px; font-weight: 500">내용</th>
<th style="padding: 8px 12px; font-weight: 500">결제수단</th>
<th style="padding: 8px 12px; font-weight: 500; text-align: right">금액</th>
</tr>
</thead>
<tbody>
<tr style="background: #F5F6F8">
<td style="padding: 6px 6px 6px 12px"><label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">날짜</span><input type="text" value="10.11" style="width: 64px; height: 34px; border: 1px solid #E6E8EC; border-radius: 8px; background: #FFFFFF; padding: 0 8px; font-size: 13px"></label></td>
<td style="padding: 6px"><label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">분류</span><input type="text" placeholder="분류" style="width: 80px; height: 34px; border: 1px solid #E6E8EC; border-radius: 8px; background: #FFFFFF; padding: 0 8px; font-size: 13px"></label></td>
<td style="padding: 6px"><label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">내용</span><input type="text" placeholder="내용 입력" style="width: 100%; min-width: 140px; height: 34px; border: 1px solid #E6E8EC; border-radius: 8px; background: #FFFFFF; padding: 0 8px; font-size: 13px"></label></td>
<td style="padding: 6px"><label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">결제수단</span><input type="text" placeholder="결제수단" style="width: 96px; height: 34px; border: 1px solid #E6E8EC; border-radius: 8px; background: #FFFFFF; padding: 0 8px; font-size: 13px"></label></td>
<td style="padding: 6px 12px 6px 6px"><label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">금액</span><input type="text" placeholder="0" style="width: 100%; min-width: 100px; height: 34px; border: 1px solid #E6E8EC; border-radius: 8px; background: #FFFFFF; padding: 0 8px; font-size: 13px; text-align: right"></label></td>
</tr>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
<tr style="border-top: 1px solid #ECEDF1">
<td style="padding: 11px 12px; color: #5F6168; white-space: nowrap">{{r.date}}</td>
<td style="padding: 11px 12px; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: {{r.tint}}; color: {{r.color}}"><span style="width: 6px; height: 6px; border-radius: 99px; background: {{r.color}}"></span>{{r.cat}}</span></td>
<td style="padding: 11px 12px">{{r.title}}</td>
<td style="padding: 11px 12px; color: #5F6168; white-space: nowrap">{{r.pay}}</td>
<td style="padding: 11px 12px; text-align: right; font-weight: 600; white-space: nowrap; color: {{r.amountColor}}">{{r.amount}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

<section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">카테고리별 지출</h2>
<div role="img" aria-label="카테고리별 비율" style="height: 12px; border-radius: 99px; overflow: hidden; display: flex; gap: 2px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<div style="height: 100%; width: {{c.pct}}%; background: {{c.bar}}"></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px">
<span style="width: 10px; height: 10px; border-radius: 3px; flex: none; background: {{c.bar}}"></span>
<span style="flex: 1">{{c.name}}</span>
<span style="color: #5F6168; font-size: 12px; width: 36px; text-align: right">{{c.pctText}}</span>
<span style="font-weight: 600; width: 84px; text-align: right">{{c.amount}}</span>
</div>
</sc-for>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var CATS = {
  '식비': { color: '#C4612A', tint: '#E07A3F1F', bar: '#E07A3F' },
  '카페': { color: '#875A40', tint: '#9A6B4F1F', bar: '#9A6B4F' },
  '교통': { color: '#2F5FC4', tint: '#3A6FD81F', bar: '#3A6FD8' },
  '쇼핑': { color: '#7448BD', tint: '#8A5CD11F', bar: '#8A5CD1' },
  '생활': { color: '#21806F', tint: '#2E9A8A1F', bar: '#2E9A8A' },
  '문화': { color: '#B83D69', tint: '#D04F7D1F', bar: '#D04F7D' },
  '의료': { color: '#4E7A2E', tint: '#5E8C3A1F', bar: '#5E8C3A' },
  '기타': { color: '#5F6168', tint: '#8A8D931F', bar: '#B4B6BA' },
  '수입': { color: '#2457C5', tint: '#2457C51A', bar: '#2457C5' }
};
var TX = [
  ['10.11 (일)', '식비', '점심 김치찌개', '신한카드', -9000],
  ['10.11 (일)', '카페', '스타벅스 아메리카노', '현대카드', -4700],
  ['10.11 (일)', '교통', '지하철', '토스 체크', -1550],
  ['10.10 (토)', '수입', '10월 월급', '국민은행', 3200000],
  ['10.10 (토)', '쇼핑', '겨울 아우터', '현대카드', -189000],
  ['10.10 (토)', '생활', '쿠팡 생필품', '신한카드', -32800],
  ['10.10 (토)', '식비', '친구 저녁', '신한카드', -25800],
  ['10.10 (토)', '문화', '넷플릭스', '현대카드', -17000],
  ['10.09 (금)', '생활', '이마트 장보기', '신한카드', -47250],
  ['10.09 (금)', '교통', '택시', '토스 체크', -16000],
  ['10.09 (금)', '의료', '약국', '현금', -8000]
];
var SUMS = [['식비', 342500], ['쇼핑', 218000], ['생활', 164300], ['카페', 98400], ['교통', 86500], ['문화', 72000], ['기타', 58000], ['의료', 48000]];
class Component extends DCLogic {
  renderVals() {
    var total = SUMS.reduce(function (a, s) { return a + s[1]; }, 0);
    return {
      menu: ['대시보드', '내역', '달력', '통계', '예산', '자산', '설정'].map(function (l, i) {
        var on = i === 0;
        return { label: l, bg: on ? '#FFF1EE' : 'transparent', fg: on ? '#B93A22' : '#5F6168', weight: on ? '600' : '400' };
      }),
      rows: TX.map(function (t) {
        var c = CATS[t[1]], n = t[4];
        return { date: t[0], cat: t[1], title: t[2], pay: t[3], color: c.color, tint: c.tint, amount: (n > 0 ? '+' : '-') + Math.abs(n).toLocaleString('ko-KR'), amountColor: n > 0 ? '#2457C5' : '#16171A' };
      }),
      cats: SUMS.map(function (s) {
        var p = s[1] / total * 100;
        return { name: s[0], bar: CATS[s[0]].bar, pct: p.toFixed(2), pctText: Math.round(p) + '%', amount: s[1].toLocaleString('ko-KR') };
      })
    };
  }
}
</script>
</body>
</html>
